# Official NSE indices, fetched directly from Yahoo Finance -- NOT constructed
# from constituents. These coexist with (never replace) the custom synthetic
# indices in custom_indices.yaml.
#
# Ticker verification note: every ticker below was confirmed against a LIVE
# Yahoo Finance quote page (not just a secondary source) as of this config's
# last edit. If a production run still logs "possibly delisted; no price
# data found" for one of these, that is very likely NOT a wrong ticker --
# it's Yahoo Finance's well-documented rate-limiting of shared/cloud IPs
# (GitHub Actions runners in particular), which is known to intermittently
# affect even blue-chip tickers like AAPL. See
# data_acquisition/sources.py's per-ticker retry fallback, which is the
# actual fix for that failure mode. Only re-verify/replace a ticker here if
# it independently 404s on finance.yahoo.com/quote/<ticker>, not merely
# because a single pipeline run logged an error for it.
benchmarks:
  # The default/primary benchmark for RRG relative-strength calculations.
  - code: NIFTY500
    name: "Nifty 500"
    ticker: "^CRSLDX"
    is_default_benchmark: true
  - code: NIFTY50
    name: "Nifty 50"
    ticker: "^NSEI"
    is_default_benchmark: false


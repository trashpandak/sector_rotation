# Custom synthetic sector indices built from the seed universe. These coexist
# with (never replace) official_indices.yaml -- the dashboard tags every index
# as OFFICIAL or CUSTOM so they can be compared directly.
#
# Weighting default: MCAP (market-cap weight) with a 30% single-constituent
# cap. Justification: pure market-cap weighting is the standard for
# broad-market indices, but a *sector* index built from a small constituent
# list is much more prone to one mega-cap distorting the whole sector's
# reading (e.g. Reliance would dominate an "Energy" sector index). Capping
# any one constituent at 30% keeps the index representative of sector
# rotation rather than single-stock movement, without going all the way to
# EQUAL weight (which would overweight illiquid small constituents and add
# noise). EQUAL weight is used for indices with only 2 constituents, where a
# 30% cap would immediately hit the documented infeasible-cap fallback
# anyway (see custom_index/weighting.py) -- EQUAL is simpler and equivalent
# in that case.
#
# `cap_split: true` additionally generates {code}_LARGE / _MID / _SMALL
# sub-indices from the same constituent pool, filtered by capitalization band
# (config/capitalization_bands.yaml) -- but ONLY for bands that clear
# min_constituents_for_cap_split, so a sector with just one small-cap name
# doesn't get a meaningless 1-stock "sub-index". Set true only where the
# seed universe actually has cap diversity for that sector.
#
# `rebalance_frequency` controls how often constituents/weights are
# recomputed (quarterly-lock, same institutional-index convention as the
# sibling Market Intelligence Engine project).
indices:
  # --- Financials ---
  - code: CUSTOM_BANKS
    name: "Custom Banks"
    sector_filter: "BANKS"
    weighting_method: MCAP
    cap_split: true
    rebalance_frequency: QUARTERLY
  - code: CUSTOM_PRIVATE_BANKS
    name: "Custom Private Banks"
    sector_filter: "BANKS"
    industry_filter: "PRIVATE_BANKS"
    weighting_method: MCAP
    cap_split: false
    rebalance_frequency: QUARTERLY
  - code: CUSTOM_PSU_BANKS
    name: "Custom PSU Banks"
    sector_filter: "BANKS"
    industry_filter: "PSU_BANKS"
